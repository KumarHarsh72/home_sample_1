<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Document</title>
</head>

<body>
    <div class="background">
        <div class="navbar">
            <div class="navlogo">
            </div>

            <div class="navaddress">
                <i class="fa-solid fa-location-dot" id="navlocationlogo"></i>
                <div class="navadd">
                    <p class="navdeliverTo">Deliver to</p>
                    <div id="navadd">H3R45</div>
                </div>
            </div>

            <div class="navsearchbar">
                <div class="navselect">
                    <select name="" id="navselect" class="navselect">
                        <option value="Top Searched" id="navselectplacer" disabled selected hidden>Top Searched</option>
                        <option value="1" id="navselect1">example</option>
                        <option value="2" id="navselect2">example</option>
                        <option value="3" id="navselect3">example</option>
                        <option value="4" id="navselect4">example</option>
                        <option value="5" id="navselect5">example</option>
                    </select>
                </div>
                <div class="navsearchinput">
                    <input type="text" placeholder="Just Search It..." id="navsearchinput">
                </div>
                <div class="navsearchlogo" id="navsearchlogo">
                    <i class="fa-solid fa-magnifying-glass" id="navsearchfont"></i>
                </div>
            </div>
            <div class="navid">
                <div class="navidlogo"></div>
                <!-- <div class="navidtext">
                    Account
                </div> -->
            </div>
            <div class="navcart">
                <div class="navcartnumber">0</div>
                <div class="navcartlogo">
                    <i class="fa-solid fa-cart-shopping" id="navcartlogo"></i>
                </div>

            </div>


        </div>
        <div class="heropage">
            <div class="slider-wrapper">
                <div class="slider">
                    <img id="slide-1" src="slide1.jpg" alt="slide-1">
                    <img id="slide-2" src="slide2.jpg" alt="slide-2">
                    <img id="slide-3" src="slide3.jpg" alt="slide-3">
                    <img id="slide-4" src="slide4.jpg" alt="slide-4">
                </div>
                <div class="slider-nav">
                    <a href="#slide-1"></a>
                    <a href="#slide-2"></a>
                    <a href="#slide-3"></a>
                    <a href="#slide-4"></a>
                </div>
            </div>
        </div>
    </div>

<script>
    const slider = document.querySelector('.slider');
    const slides = document.querySelectorAll('.slider img');

    let index = 0;

    setInterval(() => {
        index = (index + 1) % slides.length;
        slider.scrollTo({
            left: slider.clientWidth * index,
            behavior: 'smooth'
        });
    }, 5000); // 5 seconds
</script>

</body>

</html>
